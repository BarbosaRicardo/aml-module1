const BANKS = LEVELS;

const form = document.getElementById("quiz");
const scoreBox = document.getElementById("score");
const TAG = { one:"one answer", many:"select all", tf:"true / false", fill:"fill in" };

let sel = [], mode = "sample", POOL = [], order = [], graded = false;

function readURL() {
  const q = new URLSearchParams(location.search);
  const raw = (q.get("m") || q.get("module") || "").trim();
  if (raw) {
    sel = raw.split(/[,+ ]+/).map(v => parseInt(v, 10) - 1)
             .filter(i => Number.isInteger(i) && i >= 0 && i < BANKS.length);
  }
  if (!sel.length) sel = [0];
  mode = q.get("mode") === "all" ? "all" : "sample";
}
function syncURL() {
  const q = new URLSearchParams();
  q.set("m", sel.map(i => i + 1).join(","));
  q.set("mode", mode);
  const url = location.pathname + "?" + q.toString();
  history.replaceState(null, "", url);
  document.getElementById("permalink").innerHTML =
    `Link to this set: <a href="${url}">${location.origin + url}</a>`;
}
function drawChips() {
  document.getElementById("bankPick").innerHTML = BANKS.map((b, i) =>
    `<button class="chip" data-i="${i}" aria-pressed="${sel.includes(i)}">${b.name.split(" - ")[0]}</button>`
  ).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const i = +c.dataset.i;
    if (sel.includes(i)) { if (sel.length > 1) sel = sel.filter(v => v !== i); }
    else sel = [...sel, i].sort((a, b) => a - b);
    drawChips(); build();
  });
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function build() {
  POOL = [];
  sel.forEach(i => BANKS[i].questions.forEach(q => POOL.push({ ...q, bank: BANKS[i].name })));
  order = POOL.map((_, i) => i);
  if (mode === "sample") order = shuffle(order).slice(0, Math.min(10, order.length));
  syncURL();
  document.getElementById("poolInfo").textContent =
    mode === "sample"
      ? `${order.length} drawn at random from a bank of ${POOL.length}`
      : `all ${POOL.length} questions`;
  render();
}

function render() {
  graded = false;
  scoreBox.hidden = true;
  document.getElementById("retry").hidden = true;
  document.getElementById("submit").disabled = false;
  document.getElementById("submit2").disabled = false;
  form.innerHTML = "";
  const multi = sel.length > 1;

  order.forEach((qi, n) => {
    const q = POOL[qi];
    const card = document.createElement("div");
    card.className = "q"; card.dataset.qi = qi;
    const head = document.createElement("div");
    head.className = "qhead";
    head.innerHTML = `<span class="qnum">Question ${n + 1}</span>` +
      (multi ? `<span class="bankTag">${q.bank.split(" - ")[0]}</span>` : "") +
      `<span class="tag">${TAG[q.type]}</span>`;
    card.appendChild(head);
    const text = document.createElement("p");
    text.className = "qtext"; text.innerHTML = q.q;
    card.appendChild(text);

    if (q.type === "fill") {
      const inp = document.createElement("input");
      inp.type = "text"; inp.placeholder = "your answer"; inp.name = "q" + qi;
      card.appendChild(inp);
    } else {
      const opts = q.type === "tf" ? ["True", "False"] : q.options;
      const kind = q.type === "many" ? "checkbox" : "radio";
      opts.forEach((opt, oi) => {
        const lab = document.createElement("label");
        lab.className = "opt"; lab.dataset.oi = oi;
        lab.innerHTML = `<input type="${kind}" name="q${qi}" value="${oi}"><span>${opt}</span>`;
        card.appendChild(lab);
      });
    }
    form.appendChild(card);
  });
}

function normalize(s) { return s.toLowerCase().trim().replace(/\s+/g, " ").replace(/[.?!]$/, ""); }

function grade() {
  if (graded) return;
  graded = true;
  let correct = 0;
  order.forEach(qi => {
    const q = POOL[qi];
    const card = form.querySelector(`[data-qi="${qi}"]`);
    let ok = false;
    if (q.type === "fill") {
      const inp = card.querySelector("input[type=text]");
      const given = normalize(inp.value);
      ok = q.answer.some(a => { const n = normalize(a);
        return given === n || given === n + " theory" || given === n + " space" || given === n + " parameter"; });
      inp.disabled = true;
      inp.style.borderColor = ok ? "var(--good)" : "var(--bad)";
      if (!ok) { const p = document.createElement("p"); p.className = "src";
        p.innerHTML = `Correct answer: <b>${q.answer[0]}</b>`; inp.after(p); }
    } else {
      const picked = [...card.querySelectorAll("input:checked")].map(i => +i.value);
      ok = picked.length === q.answer.length && picked.every(p => q.answer.includes(p));
      card.querySelectorAll("label.opt").forEach(lab => {
        const oi = +lab.dataset.oi;
        lab.querySelector("input").disabled = true;
        const isAns = q.answer.includes(oi), chosen = picked.includes(oi);
        if (isAns) { lab.classList.add("correct");
          const m = document.createElement("span"); m.className = "mark g";
          m.textContent = chosen ? "correct" : "correct answer"; lab.appendChild(m); }
        else if (chosen) { lab.classList.add("wrong");
          const m = document.createElement("span"); m.className = "mark b";
          m.textContent = "your answer"; lab.appendChild(m); }
      });
    }
    if (ok) correct++;
    const why = document.createElement("div");
    why.className = "why";
    why.innerHTML = `<b>${ok ? "Correct" : "Not quite"}</b>${q.why}<div class="src">${q.src}</div>`;
    card.appendChild(why);
  });

  const total = order.length, pct = Math.round(correct / total * 100);
  scoreBox.hidden = false;
  scoreBox.innerHTML = `
    <h2>${sel.map(i => BANKS[i].name.split(" - ")[0]).join(" + ")}</h2>
    <div class="pct">${correct} / ${total} &middot; ${pct}%</div>
    <div class="bar"><div></div></div>
    <div class="breakdown">${
      pct === 100 ? "Every one. Draw another set to be sure it wasn't the luck of the shuffle."
      : pct >= 80 ? "Solid. Read back over the ones you missed."
      : pct >= 50 ? "Worth another pass through the notes before the next draw."
      : "Start with the source material, then come back."
    }</div>`;
  requestAnimationFrame(() => { scoreBox.querySelector(".bar > div").style.width = pct + "%"; });
  document.getElementById("retry").hidden = false;
  document.getElementById("submit").disabled = true;
  document.getElementById("submit2").disabled = true;
  scoreBox.scrollIntoView({ behavior: "smooth", block: "start" });
}

document.getElementById("submit").onclick = grade;
document.getElementById("submit2").onclick = grade;
document.getElementById("retry").onclick = () => { render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
