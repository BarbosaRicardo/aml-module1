{

  { type:"tf", q:"The joint sparse coding problem, optimizing over both the dictionary and the activations at once, is convex.",
    wrong:{0:"choosing True hides the whole reason the paper exists. If the joint problem were convex you could solve it directly and Lee et al. would have nothing to contribute. It is convex in each variable <em>separately</em>, which is what licenses alternating minimization and also why runs need not converge to the same answer twice."}, answer:[1],

    src:"Slides p. 4 &middot; Raschka ch. 14, Understanding CNNs and feature hierarchies, pdf pp. 483-485" },
  { type:"tf", q:"Sparse coding appears in the Raschka textbook as a named topic.",
    wrong:{0:"choosing True would send you hunting through 775 pages for something that is not there. Knowing which topics have no textbook backup tells you where the slides and the assigned paper are your only defence on an exam."}, answer:[1],
    why:"False. The phrase occurs zero times across all 775 pages, despite four slides, a notebook section and an assigned paper. For sparse coding, the slides and Lee et al. are your only sources.",
    src:"Verified across Raschka; Slides pp. 22-26 &middot; Lee et al." },
  { type:"one", q:"The slides connect sparse coding to which modern architectures?",
    options:["Sparse autoencoders and attention mechanisms in transformers","Recurrent networks and LSTMs","Support vector machines","Random forests"], answer:[0],
    why:"Listed under extensions alongside convolutional sparse coding for shift-invariant filters and deep sparse coding for hierarchical representations. The through-line is that a sparse selection over an overcomplete basis is a recurring idea.",
    src:"Slides p. 26" },
  { type:"one", q:"Before autoencoders became standard, what was sparse coding used for according to the slides?",
    options:["Pretraining for deep learning","Hyperparameter search","Data augmentation","Model compression at inference"], answer:[0],
    why:"Also listed: unsupervised feature extraction and compressed sensing. Pretraining mattered enormously before good initialization schemes and large labelled datasets existed.",
    src:"Slides p. 25" },
  { type:"one", q:"What does the notebook demonstrate that the slides highlight as sparse coding's advantage over PCA?",
    options:["A more interpretable basis","Lower reconstruction error","Faster computation","Guaranteed orthogonality"], answer:[0],
    why:"PCA components are dense global mixtures of every input feature; sparse coding atoms are localized and look like recognizable structures such as edges. Interpretability, not accuracy, is the selling point.",
    src:"Slides p. 26 &middot; module02_aml_feature_notebook.html" },
  { type:"tf", q:"According to the slides, a variational autoencoder combines principles from probabilistic graphical models and neural networks.",
    answer:[0],
    why:"True, and it is the bridge to your other course. The Bayesian reformulation names a posterior q<sub>&phi;</sub>(z|x), a prior p(z) and a likelihood p<sub>&theta;</sub>(x|z), which is exactly the vocabulary of Reasoning Under Uncertainty.",
    src:"Slides p. 20" },
  { type:"one", q:"In PCA, what is the projection step?",
    options:["X<sub>projected</sub> = X<sub>c</sub>V<sub>k</sub>, where V<sub>k</sub> holds the top k eigenvectors","Multiplying by the covariance matrix","Dividing by the eigenvalues","Subtracting the mean a second time"], answer:[0],
    why:"Mean-centred data times the top-k eigenvector matrix. Note it is the <em>centred</em> data being projected; forgetting the centring is the classic implementation bug.",
    src:"Slides p. 13 &middot; Raschka ch. 5, Feature transformation, pdf pp. 177-180" },
  { type:"one", q:"Why does an aligned surround stimulus matter in the end-stopping test?",
    options:["It suppresses basis activation, matching a non-linear V1 effect",
      "It increases the reconstruction error","It changes the dictionary size","It makes the bases orthogonal"], answer:[0],
    why:"Lee et al. measure each basis's response to its optimal bar with and without an aligned surround. The suppression they find is a non-linear phenomenon that simple linear models cannot explain, which is what makes the replication interesting.",
    src:"Lee et al., &sect;5.4 and Figure 3" },
  { type:"one", q:"Raschka covers linear discriminant analysis alongside PCA. What is the key difference?",
    options:["LDA is supervised and maximizes class separation; PCA is unsupervised and maximizes variance",
      "LDA is non-linear","LDA cannot reduce dimensionality","PCA requires labels"], answer:[0],
    why:"Not on your slides, but it is the cleanest way to see what PCA is <em>not</em> doing: the direction of greatest variance need not be the direction that separates classes, and often is not.",
    src:"Raschka ch. 5, PCA versus LDA, pdf pp. 185-193" },
  { type:"one", q:"What does the L2 constraint on basis vectors prevent in sparse coding?",
    options:["Bases growing without bound to make coefficients arbitrarily small","Coefficients becoming negative","The dictionary becoming overcomplete","Reconstruction error reaching zero"], answer:[0],
    why:"Without it the objective is trivially gamed: scale D up, scale a down, and the L1 penalty shrinks toward zero while the reconstruction is unchanged. The L2-constrained least squares subproblem exists to close that loophole.",
    src:"Lee et al., &sect;2 and &sect;4 &middot; Slides p. 23" },
  { type:"one", q:"Which combination of algorithms did Lee et al. find fastest overall?",
    options:["Feature-sign for coefficients with Lagrange dual for bases","LARS with gradient descent","Grafting with gradient descent","Conjugate gradient with Lagrange dual"], answer:[0],
    why:"260.0s on natural images, against 1,093.9 for feature-sign with gradient descent and 13,085.1 for LARS with gradient descent. Note both halves matter: a good coefficient solver paired with a bad basis solver still loses.",
    src:"Lee et al., Table 2" },
  { type:"tf", q:"The slides state that GAN and sequence-to-sequence methods make use of latent space.",
    answer:[0],
    why:"True, and it is why latent space is worth understanding as a general idea rather than an autoencoder detail. Raschka's chapter 17 develops the GAN case at length.",
    src:"Slides p. 7 &middot; Raschka ch. 17, pdf pp. 620-624" },
  { type:"one", q:"What is the ||a||<sub>0</sub> &lt;&lt; dim(a) condition expressing?",
    options:["Far fewer nonzero activations than the dimension of the activation vector","That activations must be positive","That the dictionary is orthogonal","That reconstruction must be exact"], answer:[0],
    why:"The L0 norm counts nonzeros, so this is the formal statement of 'sparse'. Because optimizing L0 directly is combinatorial, practice relaxes it to L1.",
    src:"Slides p. 22 &middot; Slides p. 24" },
  { type:"one", q:"Why does Raschka argue nonlinear dimensionality reduction is needed at all?",
    options:["Linear methods like PCA cannot unfold data lying on a curved manifold","Linear methods are too slow","Linear methods require labels","Linear methods cannot handle more than 100 features"], answer:[0],
    why:"This is the same assumption the slides state: high-dimensional data lies on or near a lower-dimensional manifold that is only <em>locally</em> Euclidean. A global linear projection flattens the curve and destroys the structure.",
    src:"Raschka ch. 5, Why consider nonlinear dimensionality reduction?, pdf pp. 195-196 &middot; Slides p. 10" },
  { type:"one", q:"In Conv2d, what does the in_channels parameter correspond to for a colour image?",
    options:["The three colour planes","The batch size","The number of filters","The output feature map count"], answer:[0],
    why:"Raschka devotes a section to multiple input channels. A filter spans all input channels at once, which is why a 3&times;3 filter on RGB has 27 weights rather than 9.",
    src:"Slides p. 6 &middot; Raschka ch. 14, Working with multiple input or color channels, pdf pp. 495-498" },
  { type:"one", q:"What does the lecture say sparse coding lets you do without a classifier?",
    options:["Read the class off whichever basis activates above a threshold","Skip the reconstruction step","Avoid learning a dictionary","Train without any data"], answer:[0],
    why:"\"When you have the sparse representation, you don't need a classifier, you will just look at the basis.\" If a basis is active beyond a threshold, the label associated with that basis applies. Sparsity buys interpretability that dense representations cannot.",
    src:"Sparse Coding transcript" },
  { type:"one", q:"Which optimization does the lecture compare sparse coding's difficulty to?",
    options:["GAN optimization, where two objectives work against each other","Gradient descent on a convex loss","Grid search over hyperparameters","Eigenvalue decomposition"], answer:[0],
    why:"Optimizing one component can un-optimize the other, directly or indirectly. Hence alternating minimization, and hence the warning that runs \"may not be converging consistently every time the same way.\"",
    src:"Sparse Coding transcript" },
  { type:"one", q:"In the sparse coding notebook on the Iris dataset, what are the dimensions?",
    options:["K = 3 basis vectors, each in &#8477;&#8308;, with coefficients a in &#8477;<sup>150&times;3</sup>","K = 4 basis vectors in &#8477;&sup3; with a in &#8477;<sup>3&times;150</sup>","K = 150 basis vectors in &#8477;&sup3;","K = 10 basis vectors in &#8477;<sup>28</sup>"], answer:[0],
    why:"Each &phi; lives in &#8477;&#8308; because Iris has four features; there are 150 data points, each getting a 3-dimensional coordinate. Sparsity is required on <b>a</b> only &mdash; there is no constraint on the &phi;s, which may be dependent or independent.",
    src:"Sparse Coding transcript" },
  { type:"one", q:"Why does the lecture reject Chebyshev distance as a sparsity criterion?",
    options:["It only looks at the highest component, so it cannot penalize a second large component","It is not differentiable","It requires orthogonal bases","It is too slow to compute"], answer:[0],
    why:"A vector with two large entries is not sparse, yet Chebyshev sees only the maximum and reports the same value. Euclidean fails too. The sparsity criterion has to be built deliberately, which is what the L1 penalty does.",
    src:"Sparse Coding transcript" },
  { type:"one", q:"In the notebook's alternating optimization, which method solves for the coefficients with the basis held fixed?",
    options:["Lasso regression, which is convex","Ordinary least squares","K-SVD","Conjugate gradient"], answer:[0],
    why:"Lasso for the coefficients, then a least-squares step for the basis with the coefficients fixed. The lecture stresses that each half is convex even though the joint problem is not, which is exactly the point Lee et al. build their algorithms on.",
    src:"Sparse Coding transcript &middot; Lee et al., &sect;2" }
  ]
}
];

const BANKS = LEVELS;

const form = document.getElementById("quiz");
const scoreBox = document.getElementById("score");
const TAG = { one:"one answer", many:"select all", tf:"true / false", fill:"fill in" };

let sel = [], mode = "sample", POOL = [], order = [], done = {};

function readURL() {
  const q = new URLSearchParams(location.search);
  const raw = (q.get("m") || q.get("module") || "").trim();
  if (raw) sel = raw.split(/[,+ ]+/).map(v => parseInt(v,10)-1)
                    .filter(i => Number.isInteger(i) && i>=0 && i<BANKS.length);
  if (!sel.length) sel = [0];
  mode = q.get("mode") === "all" ? "all" : "sample";
}
function syncURL() {
  const q = new URLSearchParams();
  q.set("m", sel.map(i=>i+1).join(",")); q.set("mode", mode);
  const url = location.pathname + "?" + q.toString();
  history.replaceState(null, "", url);
  document.getElementById("permalink").innerHTML =
    `Link to this set: <a href="${url}">${location.origin + url}</a>`;
}
function chipRow(el, items, cur, cb) {
  const lbl = el.querySelector(".lbl"); el.innerHTML = ""; if (lbl) el.appendChild(lbl);
  items.forEach(([v,label]) => {
    const b = document.createElement("button");
    b.className="chip"; b.dataset.v=v;
    b.setAttribute("aria-pressed", String(Array.isArray(cur) ? cur.includes(v) : cur===v));
    b.textContent=label; b.onclick=()=>cb(v); el.appendChild(b);
  });
}
function paintChips() {
  chipRow(document.getElementById("bankPick"),
    BANKS.map((b,i)=>[i, b.name.replace(/ - .*/,"")]), sel,
    i => { if (sel.includes(i)) { if (sel.length>1) sel=sel.filter(v=>v!==i); }
           else sel=[...sel,i].sort((a,b)=>a-b); paintChips(); build(); });
  document.querySelectorAll("#modeSeg button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === mode));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function build() {
  POOL = [];
  sel.forEach(i => BANKS[i].questions.forEach(q => POOL.push({...q, bank: BANKS[i].name})));
  order = POOL.map((_,i)=>i);
  if (mode === "sample") order = shuffle(order).slice(0, Math.min(10, order.length));
  syncURL();
  document.getElementById("poolInfo").textContent = mode === "sample"
    ? `${order.length} drawn at random from a bank of ${POOL.length}`
    : `all ${POOL.length} questions`;
  render();
}

function render() {
  done = {};
  scoreBox.hidden = true;
  document.getElementById("retry").hidden = true;
  document.getElementById("submit").disabled = false;
  document.getElementById("submit2").disabled = false;
  form.innerHTML = "";
  const multi = sel.length > 1;
  order.forEach((qi, n) => {
    const q = POOL[qi];
    const card = document.createElement("div");
    card.className="q"; card.dataset.qi=qi;
    const head = document.createElement("div");
    head.className="qhead";
    head.innerHTML = `<span class="qnum">Question ${n+1}</span>` +
      (multi ? `<span class="bankTag">${q.bank.replace(/ - .*/,"")}</span>` : "") +
      `<span class="tag">${TAG[q.type]}</span>`;
    card.appendChild(head);
    const text = document.createElement("p");
    text.className="qtext"; text.innerHTML=q.q; card.appendChild(text);
    if (q.type === "fill") {
      const inp=document.createElement("input");
      inp.type="text"; inp.placeholder="your answer"; inp.name="q"+qi; card.appendChild(inp);
    } else {
      const opts = q.type==="tf" ? ["True","False"] : q.options;
      const kind = q.type==="many" ? "checkbox" : "radio";
      opts.forEach((opt,oi)=>{
        const lab=document.createElement("label");
        lab.className="opt"; lab.dataset.oi=oi;
        lab.innerHTML=`<input type="${kind}" name="q${qi}" value="${oi}"><span>${opt}</span>`;
        card.appendChild(lab);
      });
    }
    const btn = document.createElement("button");
    btn.className="checkbtn"; btn.type="button"; btn.textContent="Check this answer";
    btn.onclick = () => checkOne(qi);
    card.appendChild(btn);
    form.appendChild(card);
  });
}

function normalize(s){ return s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.?!]$/,""); }
const optText = (q,i) => q.type==="tf" ? ["True","False"][i] : q.options[i];

function checkOne(qi) {
  if (done[qi] !== undefined) return done[qi];
  const q = POOL[qi];
  const card = form.querySelector(`[data-qi="${qi}"]`);
  let ok=false, picked=[];

  if (q.type === "fill") {
    const inp = card.querySelector("input[type=text]");
    const given = normalize(inp.value);
    ok = q.answer.some(a=>{const n=normalize(a);
      return given===n || given===n+" theory" || given===n+" space" || given===n+" parameter";});
    inp.disabled = true;
    inp.style.borderColor = ok ? "var(--good)" : "var(--bad)";
  } else {
    picked = [...card.querySelectorAll("input:checked")].map(i=>+i.value);
    ok = picked.length===q.answer.length && picked.every(p=>q.answer.includes(p));
    card.querySelectorAll("label.opt").forEach(lab=>{
      const oi=+lab.dataset.oi;
      lab.querySelector("input").disabled=true;
      const isAns=q.answer.includes(oi), chosen=picked.includes(oi);
      if (isAns) { lab.classList.add("correct");
        const m=document.createElement("span"); m.className="mark g";
        m.textContent = chosen ? "correct" : "correct answer"; lab.appendChild(m); }
      else if (chosen) { lab.classList.add("wrong");
        const m=document.createElement("span"); m.className="mark b";
        m.textContent="your answer"; lab.appendChild(m); }
    });
  }

  card.querySelector(".checkbtn")?.remove();

  const why=document.createElement("div");
  why.className="why";
  why.innerHTML = `<b>${ok ? "Correct" : "Not quite"}</b>${q.why}`;
  card.appendChild(why);

  if (!ok) {
    const chosen = q.type==="fill"
      ? [] : picked.filter(i => !q.answer.includes(i));
    const missed = q.type==="fill"
      ? [] : q.answer.filter(i => !picked.includes(i));
    let html = "";
    chosen.forEach(i => {
      const custom = q.wrong && q.wrong[i];
      html += `<p><b>&ldquo;${optText(q,i)}&rdquo;</b> &mdash; ` +
        (custom || `not the answer here. The explanation above gives the one that is; the reading below settles it.`) + `</p>`;
    });
    if (q.type==="fill" && !ok) {
      html += `<p>The answer is <b>${q.answer[0]}</b>. ${(q.wrong && q.wrong.fill) || "Check the spelling and note that only the missing word goes in the box."}</p>`;
    }
    if (missed.length) {
      html += `<p><b>You missed:</b> ` + missed.map(i=>`&ldquo;${optText(q,i)}&rdquo;`).join(", ") +
        `. On a select-all, leaving a correct option out costs the same as adding a wrong one.</p>`;
    }
    if (html) {
      const wb=document.createElement("div");
      wb.className="wrongbox";
      wb.innerHTML=`<div class="l">Why your choice does not work</div>${html}`;
      card.appendChild(wb);
    }
  }

  const rn=document.createElement("div");
  rn.className="readnext";
  rn.innerHTML=`<div class="l">Read next</div>${q.src}`;
  card.appendChild(rn);

  done[qi]=ok;
  if (Object.keys(done).length === order.length) showScore();
  return ok;
}

function showScore() {
  const total=order.length;
  const correct=order.filter(qi=>done[qi]).length;
  const pct=Math.round(correct/total*100);
  scoreBox.hidden=false;
  scoreBox.innerHTML=`
    <h2>${sel.map(i=>BANKS[i].name.replace(/ - .*/,"")).join(" + ")}</h2>
    <div class="pct">${correct} / ${total} &middot; ${pct}%</div>
    <div class="bar"><div></div></div>
    <div class="breakdown">${
      pct===100 ? "Every one. Draw another set to be sure it wasn't the shuffle."
      : pct>=80 ? "Solid. Read the Read next line on anything you missed."
      : pct>=50 ? "Worth another pass through the sources before the next draw."
      : "Start with the source material, then come back."}</div>`;
  requestAnimationFrame(()=>{scoreBox.querySelector(".bar > div").style.width=pct+"%";});
  document.getElementById("retry").hidden=false;
  document.getElementById("submit").disabled=true;
  document.getElementById("submit2").disabled=true;
}

function gradeAll(){ order.forEach(qi=>checkOne(qi));
  scoreBox.scrollIntoView({behavior:"smooth",block:"start"}); }

document.getElementById("submit").onclick=gradeAll;
document.getElementById("submit2").onclick=gradeAll;
document.getElementById("retry").onclick=()=>{render();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("newSet").onclick=()=>{build();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("modeSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.mode;paintChips();build();};

readURL(); paintChips(); build();
</script>
</body>
</html>
