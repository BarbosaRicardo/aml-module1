<script>
const LEVELS = [
{
  name: "Module 1 · Easy",
  blurb: "Definitions and recall, straight from the slides.",
  questions: [
  { type:"one",
    q:"In this module, optimization is defined as what?",
    options:["The process of finding parameters that minimize a loss function","The process of selecting the best model architecture","The process of cleaning and normalizing training data","The process of measuring accuracy on a held-out set"],
    wrong:{"1":"that is model selection, which sits above the loss minimization rather than inside it. keeping the two apart matters because hyperparameter search chooses the model and then optimization fits &theta; within it.", "2":"that is preprocessing. scaling does help gradient descent converge, but it prepares the data for the optimization rather than being the optimization.", "3":"that is evaluation. it supplies the objective that hyperparameter search minimizes, but the module's definition is about fitting parameters to a loss, not scoring a fitted model."}, answer:[0],
    why:"The general form given is min<sub>&theta;</sub> &#8466;(&theta;; X, y), where &theta; are the model parameters and &#8466; is the loss. It is described as central to training, covering weights, biases and hyperparameters.",
    src:"Slides p. 4 &middot; Raschka ch. 2, Minimizing loss functions with gradient descent, pdf p. 68" },
  { type:"one",
    q:"In the gradient descent update rule &theta; &larr; &theta; &minus; &eta;&nabla;<sub>&theta;</sub>&#8466;(&theta;), what is &eta;?",
    options:["The learning rate","The gradient magnitude","The regularization penalty","The number of epochs"],
    wrong:{"1":"the magnitude is already carried by &nabla;<sub>&theta;</sub>&#8466;(&theta;); &eta; is the separate scalar you choose. conflating them hides the fact that step size is a hyperparameter you have to tune, and it is the one most likely to make a run diverge.", "2":"a regularization penalty appears inside the loss, changing what is being minimized. &eta; multiplies the gradient and changes only how far you move.", "3":"epochs count how many passes you make over the data. &eta; sets the distance of each individual step, so the two control completely different things."}, answer:[0],
    why:"&eta; scales how far each step moves along the negative gradient. The minus sign is what makes it descent rather than ascent.",
    src:"Slides p. 5 &middot; Raschka ch. 2, pdf p. 68-70" },
  { type:"many",
    q:"Which of these are listed as variants of gradient descent?",
    options:["Batch gradient descent, using the full dataset","Stochastic gradient descent, using one sample","Mini-batch gradient descent, using a subset","Swarm gradient descent, using a particle population"],
    wrong:{3:"there is no such thing. PSO is a separate, derivative-free family; it does not compute a gradient at all, so it cannot be a gradient descent variant. The three real variants differ only in how much data each update uses."}, answer:[0,1,2],
    why:"The three variants differ only in how much data each update uses. Particle swarm optimization is a separate, derivative-free method, not a gradient descent variant.",
    src:"Slides p. 5 and p. 12 &middot; Raschka ch. 2, Large-scale ML and stochastic gradient descent, pdf p. 76-81" },
  { type:"tf",
    q:"In a convex optimization problem, any local minimum is also a global minimum.",
    wrong:{"1":"convexity is exactly what rules out spurious local minima, which is why convex problems yield to plain gradient descent. denying it removes the reason the module treats deep networks, whose non-linearity destroys convexity, as the hard case."}, answer:[0],
    why:"True, and it is the property that makes convex problems tractable. As the lecture puts it, whether you are minimizing or maximizing does not matter, since flipping the sign converts one into the other.",
    src:"Slides p. 16 &middot; Hyperparameter Optimization transcript &middot; Raschka ch. 2, pdf p. 68 (Adaline MSE is convex, which is why plain gradient descent suffices)" },
  { type:"one",
    q:"Particle swarm optimization is inspired by what?",
    options:["Naturally occurring animal swarms such as bird flocks or insect swarms","Simulated annealing of metals","Neural signaling in the visual cortex","Genetic crossover in DNA replication"],
    wrong:{"1":"that is the metallurgy analogy behind simulated annealing, a different derivative-free method.", "2":"that inspiration belongs to neural networks, and in Module 2 to sparse coding's V1-like bases.", "3":"that is the genetic algorithm, the other metaheuristic Yang and Shami discuss alongside PSO. GA and PSO are often paired, which is what makes this one tempting."}, answer:[0],
    why:"Particles move through the feasible solution space and tend to follow each other, the way members of a flock do.",
    src:"Slides p. 12 &middot; PSO and Bayesian Optimizations transcript &middot; PSO is not covered in Raschka" },
  { type:"one",
    q:"What is early stopping?",
    options:[
      "A regularization technique that halts training when validation performance stops improving",
      "A method that stops training once the training loss reaches zero",
      "A rule that caps every training run at a fixed number of epochs",
      "A pruning method that removes low-weight connections mid-training"],
    wrong:{"1":"training loss falling is not a stopping signal; it keeps falling while validation loss turns upward, which is the overfitting you are trying to catch. stopping at zero training loss means stopping at the most overfit point available.", "2":"a fixed epoch budget is precisely what early stopping replaces. the whole point is deciding dynamically from measured validation performance rather than from a number you guessed in advance.", "3":"that is weight pruning, a compression technique. early stopping changes when you stop, not what the network contains."}, answer:[0],
    why:"It is explicitly framed as a form of regularization that determines the number of training iterations dynamically from real-time performance, rather than from a preset epoch count.",
    src:"Slides p. 20 &middot; Early Stopping transcript &middot; not covered in Raschka; the nearest material is over- and underfitting with validation curves, pdf p. 214" },
  { type:"fill",
    q:"The ______ parameter lets training continue for p epochs without improvement before stopping, which avoids halting on noisy fluctuations.",
    answer:["patience"],
    why:"Without it, a single bad epoch would end the run. Patience buys tolerance for noise in the validation curve.",
    src:"Slides p. 21 &middot; Early Stopping transcript &middot; not covered in Raschka" },
  { type:"many",
    q:"Which search strategies for hyperparameter optimization are listed in the slides?",
    options:["Grid search, exhaustive over combinations","Random search, random samples","Bayesian optimization, modeling performance to guide the search","Gradient search, following the hyperparameter gradient"],
    wrong:{3:"hyperparameters generally have no usable gradient, which is the entire reason derivative-free methods exist. If you could differentiate through them you would not need grid, random or Bayesian search."}, answer:[0,1,2],
    why:"The first three are named, along with automated libraries such as Optuna, Hyperopt and scikit-learn's GridSearchCV. Hyperparameters generally have no usable gradient, which is the whole reason derivative-free methods are needed.",
    src:"Slides p. 7 &middot; Raschka ch. 6, Fine-tuning models via grid search, pdf p. 216-222" },
  { type:"one",
    q:"In Bayesian optimization, what is the surrogate model most commonly?",
    options:["A Gaussian process","A random forest","A support vector machine","A convolutional network"],
    wrong:{"1":"a random forest surrogate is a real variant, and it is SMAC, but it is not the common default. the standard choice is a Gaussian process because it hands you a variance as well as a mean.", "2":"an SVM gives a point prediction with no uncertainty estimate, so an acquisition function would have nothing to explore against and Bayesian optimization would degenerate into pure exploitation.", "3":"a convolutional network needs far more training data than the entire search budget of expensive objective evaluations, which is typically a few dozen points."}, answer:[0],
    why:"The surrogate p(f | D) approximates the expensive objective. A Gaussian process is a distribution over functions, so any finite set of function values follows a multivariate normal distribution.",
    src:"Slides p. 17-18 &middot; PSO and Bayesian Optimizations transcript &middot; Raschka ch. 6 covers Bayesian search only briefly, as the TPE method in hyperopt, pdf p. 222" },
  { type:"many",
    q:"Which of these are named as acquisition functions?",
    options:["Expected Improvement (EI)","Upper Confidence Bound (UCB)","Probability of Improvement","Mean Squared Error"],
    wrong:{"3":"mean squared error is a loss used to fit models, not a rule for choosing where to sample next. an acquisition function has to combine the surrogate's mean with its variance, and MSE has no uncertainty term to trade against."}, answer:[0,1,2],
    why:"EI and UCB appear on the slides, with probability of improvement and entropy search added in the lecture. Mean squared error is a loss function, not a rule for choosing where to sample next.",
    src:"Slides p. 18 &middot; PSO and Bayesian Optimizations transcript &middot; not covered in Raschka" },
  { type:"many",
    q:"Yang and Shami classify hyperparameters into which types?",
    options:["Continuous","Discrete","Categorical","Stochastic"],
    wrong:{"3":"not a type in their taxonomy. stochasticity is a property of a search method, not of a hyperparameter's domain, and the domain type is what decides which methods can be applied at all."}, answer:[0,1,2],
    why:"Continuous and discrete hyperparameters usually have bounded domains in practice. The type matters because it decides which search methods can even be applied.",
    src:"Yang and Shami &sect;2, p. 4" },
  { type:"one",
    q:"What is a <em>conditional</em> hyperparameter?",
    options:[
      "One that only needs tuning depending on the value of another hyperparameter",
      "One whose value is a conditional probability",
      "One tuned on the validation set rather than the training set",
      "One that changes during training"],
    wrong:{"1":"the word conditional here describes structure in the search space, not probability. nothing about the hyperparameter's value has to be a probability.", "2":"every hyperparameter is scored on validation data, so that cannot be what distinguishes a conditional one.", "3":"that describes a schedule, such as a decaying learning rate. a conditional hyperparameter is fixed for a run but only exists at all depending on another hyperparameter's value."}, answer:[0],
    why:"In an SVM, the polynomial degree only exists once you have chosen a polynomial kernel. Yang and Shami note this is why some methods, notably TPE, are preferred: they natively preserve these conditional relationships.",
    src:"Yang and Shami &sect;2, pp. 4 and 13" },
  { type:"one",
    q:"Grid search is best described as what?",
    options:[
      "An exhaustive brute-force evaluation of the Cartesian product of specified values",
      "A method that samples configurations at random",
      "A method that models performance to guide the search",
      "A method that halves the candidate set at each round"],
    wrong:{"1":"that is random search, the method grid search is usually compared against. random search covers more distinct values per dimension for the same budget, which is why it often wins.", "2":"that is model-based or Bayesian optimization. grid search has no model and no memory of earlier evaluations at all.", "3":"that is successive halving, a budget allocation scheme rather than a way of enumerating configurations."}, answer:[0],
    why:"It evaluates every combination on the grid. Yang and Shami add the limitation: grid search cannot exploit well-performing regions by itself, so narrowing the space has to be done manually between runs.",
    src:"Slides p. 7 &middot; Yang and Shami &sect;4, p. 9 &middot; Raschka ch. 6, pdf p. 216" },
  { type:"tf",
    q:"A convex function has a unique minimum or maximum point.",
    wrong:{"1":"in the sense the module intends, a convex problem has a single optimum with no separate local traps to fall into. rejecting this leaves you unable to explain why plain gradient descent suffices on Adaline's MSE loss but not on a deep network."}, answer:[0],
    why:"True. And whether you frame it as minimization or maximization does not matter, since flipping the sign converts one into the other. That is why the notes speak of convex versus non-convex rather than convex versus concave.",
    src:"Slides p. 16 &middot; Hyperparameter Optimization transcript" },
  { type:"one",
    q:"What does momentum do in an optimizer?",
    options:[
      "Accelerates convergence by smoothing updates",
      "Adapts the learning rate separately for each parameter",
      "Halts training when validation loss stops improving",
      "Removes the need to compute gradients"],
    wrong:{"1":"that is AdaGrad, RMSProp and Adam. momentum accumulates past updates to smooth the direction; it does not maintain a separate rate per parameter.", "2":"that is early stopping, a rule about when to end training rather than a modification of the update.", "3":"momentum is a gradient method and still needs the derivative at every step. derivative-free territory is PSO's."}, answer:[0],
    why:"Momentum smooths; AdaGrad, RMSProp and Adam adapt per-parameter rates. The transcript frames both as variations on the same steepest-descent skeleton, one playing with the step direction and the other with the step size.",
    src:"Slides p. 6 &middot; Hyperparameter Optimization transcript" },
  { type:"many",
    q:"Which automated hyperparameter libraries are named in the slides?",
    options:["Optuna","Hyperopt","scikit-learn GridSearchCV","PyTorch Lightning"],
    wrong:{"3":"a training framework for organizing loops and hardware, not a hyperparameter search tool. reaching for it here means you would still have to write the search yourself."}, answer:[0,1,2],
    why:"The first three are listed as libraries used in practice. PyTorch Lightning is a training framework, not a hyperparameter search tool, though Raschka does cover it in chapter 13.",
    src:"Slides p. 7 &middot; Raschka ch. 13, pdf p. 470" },
  { type:"tf",
    q:"Particle swarm optimization requires computing derivatives of the objective function.",
    wrong:{"0":"PSO never differentiates the objective; particles move by comparing evaluated costs against lbest and gbest. assuming derivatives are required rules PSO out of exactly the non-differentiable or flat-region problems it was chosen for."}, answer:[1],
    why:"False, and it is PSO's main structural advantage. Particles move by comparing costs and sharing results, so flat or non-differentiable regions do not stall them.",
    src:"Slides p. 15 &middot; PSO and Bayesian Optimizations transcript" },
  { type:"tf",
    q:"A Gaussian process is a distribution over functions, meaning any finite set of function values follows a multivariate normal distribution.",
    wrong:{"1":"that multivariate-normal property over any finite set of points is the definition of a Gaussian process, and it is what produces both a mean and a variance at unobserved points. without it there is no uncertainty term for the acquisition function to use."}, answer:[0],
    why:"True, and that is exactly what makes it usable as a surrogate. It returns a mean prediction <em>and</em> a variance estimate, and the variance is what the acquisition function needs.",
    src:"PSO and Bayesian Optimizations transcript &middot; Slides p. 18" },
  { type:"one",
    q:"What is the purpose of successive halving in hyperparameter search?",
    options:[
      "Give every candidate a small budget, then discard the worst half and give survivors more",
      "Halve the learning rate at each epoch",
      "Split the dataset in half for cross-validation",
      "Reduce the search space dimensionality by half"],
    wrong:{"1":"that is a learning-rate schedule inside a single training run. successive halving discards whole candidate configurations across runs.", "2":"that is a data split for cross-validation. successive halving splits the budget, not the dataset.", "3":"it never touches dimensionality. what it halves is the number of surviving configurations, while each survivor keeps all its hyperparameters."}, answer:[0],
    why:"It is a resource-efficient alternative to spending a full budget on every candidate. Raschka covers it directly; the module slides do not mention it, so this comes from the textbook side of the mapping.",
    src:"Raschka ch. 6, More resource-efficient hyperparameter search, pdf p. 220 &middot; Yang and Shami &sect;4.4" },
  { type:"one",
    q:"In early stopping, which curve provides the signal to stop?",
    options:["Validation loss","Training loss","The learning rate schedule","The gradient norm"],
    wrong:{"1":"training loss falls essentially monotonically, so it can never tell you to stop and would carry you straight into overfitting.", "2":"that is something you set, not something you measure. a schedule carries no information about generalization.", "3":"a small gradient norm says you have converged on the training objective, which is again a statement about the training set rather than about held-out performance."}, answer:[0],
    why:"Training loss keeps falling essentially forever, so it can never tell you to stop. Only the validation curve turns upward, and that turn is the whole signal.",
    src:"Slides p. 20 &middot; Early Stopping transcript" },
  { type:"one",
    q:"If the learning rate is set far too large, what typically happens?",
    options:[
      "The loss increases and the run diverges",
      "The loss decreases more slowly but still converges",
      "Training becomes deterministic",
      "The gradient becomes exactly zero"],
    wrong:{"1":"that is the symptom of a rate too <em>small</em>, the opposite failure. mistaking the two leads you to raise the learning rate when the fix is to lower it.", "2":"determinism depends on batching, shuffling and seeds. step size has nothing to do with it.", "3":"overshooting lands you in steeper regions, so the gradient grows rather than vanishing. a vanishing gradient is a different pathology entirely."}, answer:[0],
    why:"Each step overshoots the minimum and lands somewhere steeper, so the next step is bigger still. Loss rising while the algorithm does exactly what it was told is the classic signature.",
    src:"Slides p. 5 &middot; Raschka ch. 2, pdf pp. 68-70" },
  { type:"one",
    q:"What do L1 and L2 penalties do in optimization?",
    options:[
      "Stabilize solutions by penalizing model complexity",
      "Increase the learning rate over time",
      "Guarantee convexity of any loss function",
      "Replace the need for a validation set"],
    wrong:{"1":"penalties change the objective being minimized, not the schedule of step sizes.", "2":"the penalty term is convex, but adding it to a non-convex deep-network loss leaves the whole problem non-convex. it improves conditioning, not convexity.", "3":"the penalty strength is itself a hyperparameter that has to be chosen on held-out data, so regularization increases your need for a validation set rather than removing it."}, answer:[0],
    why:"They are listed on the slides as regularization in optimization. Raschka develops both, and notes the practical difference: L1 produces sparse solutions, driving some weights to exactly zero.",
    src:"Slides p. 6 &middot; Raschka ch. 4, pdf pp. 153-159" },
  { type:"tf",
    q:"Early stopping is useful mainly because it improves generalization; it does not reduce computational cost.",
    wrong:{"0":"the transcript credits early stopping with both benefits and singles out the compute saving as especially valuable when each training run is expensive, as inside a hyperparameter search. dropping the compute half removes the main reason to use it in an HPO loop."}, answer:[1],
    why:"False. It does both, and the transcript stresses the compute saving, calling it \"particularly useful in scenarios where training a model is computationally expensive, such as hyperparameter optimization or large-scale deep learning.\"",
    src:"Early Stopping transcript &middot; Slides p. 22" },
  { type:"one",
    q:"According to the module learning objectives, what are acquisition functions used to balance?",

    wrong:{"1":"concave is the mirror image obtained by flipping the sign, so it is the same easy case rather than the negation. that sign flip is precisely why the lecture refuses to use concave as the opposite.", "2":"invented term. convexity either holds over the feasible region or it does not.", "3":"the property is well defined and simply fails. calling it undefined leaves you with no vocabulary for the hard case the whole module is about."}, answer:[0],
    why:"Since flipping the sign turns a minimization into a maximization, convex and concave are two views of one property. The negation is therefore non-convex.",
    src:"Hyperparameter Optimization transcript &middot; Raschka ch. 11, About convergence in neural networks, pdf p. 398" },
  { type:"tf",
    q:"PSO is a greedy approach and is not guaranteed to converge to a global minimum.",
    wrong:{"1":"PSO is greedy and can settle on a local optimum; the good random number generator exists to keep particles exploring rather than collapsing early. treating its output as a global optimum means you stop re-running with different seeds and initializations."}, answer:[0],
    why:"True. It is listed alongside the requirement for a good uniform random number generator, which is what keeps particles wandering enough to discover better solutions rather than collapsing early.",
    src:"Slides p. 15 &middot; PSO is not covered in Raschka" },
  { type:"one",
    q:"According to the lecture, why are deep neural networks difficult to optimize?",
    options:[
      "The non-linearity that makes them universal function approximators also makes them non-convex",
      "They have too few parameters to fit a surrogate model",
      "Their loss functions have no derivatives",
      "They can only be trained with derivative-free methods"],
    wrong:{"1":"deep networks have far too many parameters, not too few, and parameter count is not what makes them hard to optimize.", "2":"their losses are differentiable almost everywhere, which is exactly why backpropagation works. the difficulty is the shape of the surface, not the absence of derivatives.", "3":"they are trained with gradient methods almost exclusively. derivative-free methods are what you reach for when gradients are unavailable, which is not the case here."}, answer:[0],
    why:"The same property buys the power and the difficulty. The consequence is that global optimization is not guaranteed, so smart architectures and specialized heuristics are needed to speed up convergence.",
    src:"Hyperparameter Optimization transcript &middot; Raschka ch. 11, About convergence in neural networks, pdf p. 398" },
  { type:"one",
    q:"Raschka describes Adam as inspired by which two earlier methods?",
    options:["RMSProp and AdaGrad","Momentum and Nesterov acceleration","SGD and mini-batch GD","Hyperband and BOHB"],
    wrong:{"1":"Adam does carry a momentum-like first-moment term, which is what makes this tempting, but Raschka names RMSProp and AdaGrad as the inspirations, and those are the adaptive-rate half of the design.", "2":"those are batching regimes Adam runs inside, not adaptive-step-size methods it descends from.", "3":"those are hyperparameter search methods from Module 1, a completely different layer of the problem."}, answer:[0],
    why:"He also frames Adam as suited to <em>nonconvex</em> optimization specifically, which is why it dominates deep learning where convexity is unavailable.",
    src:"Raschka ch. 14, pdf p. 510" },
  { type:"one",
    q:"The instructor draws an analogy between stochastic gradient descent and which ensemble method?",
    options:[
      "Random forest, which uses a random subset of dimensions per weak learner",
      "AdaBoost, which reweights misclassified examples",
      "Voting classifiers, which take a majority vote",
      "Bagging, which resamples the training set"],
    wrong:{"1":"AdaBoost reweights misclassified examples deterministically. the analogy being drawn is about random subsetting, not about reweighting.", "2":"voting classifiers combine independently trained models at prediction time, with no subsampling inside any update.", "3":"bagging resamples the training set, which is close, but the specific analogy given is to random forest's random subset of <em>dimensions</em> per learner."}, answer:[0],
    why:"The transcript asks you to see it: SGD uses a random subset of the data or dimensions to compute each update, exactly as random forest uses a random subset of dimensions per tree. Both trade exactness per step for speed and robustness.",
    src:"Hyperparameter Optimization transcript" },
  { type:"one",
    q:"In the transcript's framing, what distinguishes Adam from plain steepest descent?",
    options:[
      "Adam varies &alpha;, the step size, dynamically and per parameter",
      "Adam varies the direction rather than the step size",
      "Adam removes the derivative from the update",
      "Adam guarantees convergence"],
    wrong:{"1":"varying the direction is closer to what momentum contributes. Adam's headline in this framing is that it varies &alpha; dynamically and per parameter.", "2":"Adam is entirely gradient-based; it rescales the derivative rather than removing it.", "3":"no such guarantee, as the lecture says of all three variants."}, answer:[0],
    why:"The instructor maps all three variants onto one skeleton: play with &alpha; and you get momentum or Adam; play with the number of dimensions of X and you get stochastic gradient descent. Same algorithm, different knob.",
    src:"Hyperparameter Optimization transcript" },
  { type:"tf",
    q:"Yang and Shami report that a reliable, community-agreed benchmark platform exists for comparing all common HPO algorithms.",
    wrong:{"0":"they flag the absence of such a benchmark as an open issue. COCO covers continuous optimizers generally, but nothing equivalent exists for HPO methods, which means published speed and accuracy comparisons are less comparable than they look."}, answer:[1],
    why:"False, and they flag it as an open issue. COCO exists for continuous optimizers generally, but there is no equivalent covering hyperparameter optimization methods, which makes published comparisons hard to trust.",
    src:"Yang and Shami &sect;8, p. 19" },
  { type:"one",
    q:"What cost-function trick does the instructor suggest for enforcing a false-alarm constraint?",
    options:[
      "Return a very high cost whenever false alarms exceed the threshold",
      "Remove all false-alarm cases from the training set",
      "Weight the loss by the inverse class frequency",
      "Switch from PSO to grid search"],
    wrong:{"1":"deleting the negatives makes false alarms invisible to the model and guarantees the constraint is violated once it meets real traffic.", "2":"inverse-frequency weighting is a reasonable imbalance technique, but it rebalances the loss rather than enforcing a specific ceiling that an operator has set.", "3":"changing the search algorithm does nothing about which cost function is being optimized, and the cost function is where the constraint has to live."}, answer:[0],
    why:"The optimizer then learns never to cross the limit and maximizes detection within it. The transcript ties this to cybersecurity, where the acceptable false-alarm rate is set by the security officer, not by the model.",
    src:"PSO and Bayesian Optimizations transcript" },
  { type:"one",
    q:"How does the transcript contrast acquisition functions with PSO's velocity update?",
    options:[
      "Velocity gives roughly equal steps; acquisition functions can jump long distances more intelligently",
      "Velocity is deterministic; acquisition functions are random",
      "Velocity requires gradients; acquisition functions do not",

    wrong:{"1":"backwards in spirit: the velocity update is explicitly scaled by random factors, so randomness is not what separates the two.", "2":"PSO's defining feature is that it needs no gradients at all, so this reverses its main property.", "3":"they do play the same role, but the lecture draws a real contrast in step behaviour: velocity moves in roughly even increments while an acquisition function can jump far."}, answer:[0],
    why:"Both answer the same question, where to sample next. The instructor calls the velocity update PSO's acquisition function, then notes acquisition functions sample \"similar to steepest descent but much more intelligent than that.\"",
    src:"PSO and Bayesian Optimizations transcript" },
  { type:"tf",
    q:"Raschka's Adaline example uses mean squared error partly because that loss is convex, which is what makes plain gradient descent sufficient.",
    wrong:{"1":"Raschka says directly that the Adaline loss is differentiable and convex, and that this is why a simple gradient descent suffices. missing that qualifier is how people expect the same reliability from a deep network's loss."}, answer:[0],
    why:"True, and he says so directly: the loss is differentiable and \"another nice property of this loss function is that it is convex; thus, we can use a very simple yet powerful optimization algorithm called gradient descent.\" The whole module's difficulty comes from losing that property.",
    src:"Raschka ch. 2, pdf p. 68" },
  { type:"one",
    q:"When the problem is genuinely non-convex, what does the instructor say the only guaranteed approach would be?",
    options:[
      "Brute force, which is exponential",
      "Steepest descent with a small enough learning rate",
      "Lagrange multipliers",
      "Increasing the number of training epochs"],
    wrong:{"1":"a smaller step does not escape a local minimum; it just arrives at one more slowly. shrinking &alpha; changes convergence speed, not the guarantee.", "2":"Lagrange multipliers give deterministic solutions for constrained <em>convex</em> problems, which is the case being contrasted with, not the non-convex one.", "3":"more of the same greedy search is still greedy. epochs do not convert a heuristic into a guarantee."}, answer:[0],
    why:"He ties it to complexity theory: such problems live under non-deterministic polynomial, so exact solutions are exponential. We use greedy methods anyway \"because we don't have anything else,\" while convex problems may admit deterministic solutions via Lagrange multipliers.",
    src:"Hyperparameter Optimization transcript" },
  { type:"tf",
    q:"Yang and Shami report that metaheuristic algorithms such as GA and PSO support all types of hyperparameter.",
    wrong:{"1":"supporting continuous, discrete and categorical hyperparameters is exactly why they recommend PSO for large mixed spaces. dismissing metaheuristics on type grounds pushes you toward BO-GP in the one regime where it fits worst."}, answer:[0],
    why:"True, and it is the reason they recommend PSO for large spaces with mixed types. The cost is complexity: they are more complicated than most other HPO algorithms, though they reach near-optimal solutions efficiently on large configuration spaces.",
    src:"Yang and Shami &sect;5, p. 13" },
  { type:"one",
    q:"Where does the instructor say the derivative implicitly appears in PSO, despite none being computed?",
    options:[
      "In how particle directions change according to lbest and gbest",
      "In the cost function evaluation",
      "In the random number generator",
      "Nowhere; PSO has no relationship to gradients"],
    wrong:{"1":"an evaluation returns a scalar cost with no directional information. direction emerges from comparing costs across particles and iterations, not from any single evaluation.", "2":"randomness scales the pull toward lbest and gbest, but it contributes no directional information of its own.", "3":"the lecture's point is the opposite: the swarm approximates gradient information collectively, in an indirect manner, without ever computing a derivative."}, answer:[0],
    why:"\"The derivative is here in an indirect manner... the directions are being changed according to my local best and global best.\" The swarm's collective behaviour approximates gradient information without ever computing it.",
    src:"PSO and Bayesian Optimizations transcript" },
  { type:"one",
    q:"The instructor argues that convexity of a hyperparameter optimization problem depends on what?",
    options:[
      "Both the loss function and the constraints defining the search space",
      "The loss function alone",
      "The number of hyperparameters",
      "Whether the optimizer is gradient-based"],
    wrong:{"1":"a convex loss is required but not enough. a constraint boundary can make part of the feasible region non-convex even when the loss itself behaves perfectly.", "2":"dimensionality affects how hard the search is, not whether the problem is convex.", "3":"convexity is a property of the problem, not of the method you point at it. this confusion leads people to expect convex-like reliability just because they used gradient descent."}, answer:[0],
    why:"A convex loss is \"required, but not enough.\" A constraint boundary can render part of the feasible region non-convex even when the loss behaves perfectly. Lasso keeps the problem convex; a deep network with non-linear activations does not.",
    src:"Hyperparameter Optimization transcript" },
  { type:"one",
    q:"In the Secretary Problem analogy, what does the 1/e rule buy you?",
    options:[
      "Roughly 63% of the evaluation cost avoided, by observing about 37% before committing",
      "A guarantee of selecting the best candidate",
      "A 37% chance of never stopping",
      "A reduction in variance of the validation estimate"],
    wrong:{"1":"the rule maximizes the probability of picking the best candidate; it guarantees nothing, and the guarantee is not what the analogy is about.", "2":"the 37% is the fraction you observe before you start committing, not a probability of failing to stop.", "3":"the rule concerns when to stop, not the precision of any estimator."}, answer:[0],
    why:"The instructor is emphatic that the constant is 1/e and not 1/3, and frames the payoff as compute saved: \"If I use 37% rule, I'm saving 63% computation.\" The shared structure with early stopping is deciding when to stop on partial information.",
    src:"Early Stopping transcript" },
  { type:"tf",
    q:"According to the transcript, a Gaussian process surrogate is a deterministic model of the objective function.",
    wrong:{"0":"the transcript says the opposite, that it is not a deterministic model and provides a mean plus a variance. a deterministic surrogate would leave no uncertainty to explore, and Bayesian optimization would collapse into pure exploitation."}, answer:[1],
    why:"False. \"It's not a deterministic model. It provides a mean prediction and a variance estimate,\" which is precisely what enables acquisition-function computation. A deterministic surrogate would leave nothing to explore.",
    src:"PSO and Bayesian Optimizations transcript" },
  { type:"one",
    q:"Why does the instructor say deep neural networks are used despite being non-convex?",
    options:[
      "They are universal function approximators, so we compensate with smart architectures and optimization methods",
      "Their loss functions are convex in practice",
      "Non-convexity makes them faster to train",
      "Convex models cannot handle categorical features"],
    wrong:{"1":"they are not convex in practice. the lecture's point is that we accept non-convexity and compensate with architecture and optimizer choices.", "2":"non-convexity makes optimization harder and offers no speed benefit; it is the cost being paid, not the reason.", "3":"untrue and unrelated. convex models such as logistic regression handle encoded categorical features perfectly well."}, answer:[0],
    why:"The non-linearity that makes them universal approximators is the same property that destroys convexity. Global optimization is not guaranteed, so specialized heuristics exist to speed up convergence.",
    src:"Hyperparameter Optimization transcript" },
  { type:"one",
    q:"Yang and Shami note that for tree-based models such as XGBoost, several hyperparameters control regularization. Which pair are the L1 and L2 terms on weights?",
    options:["alpha and lambda","gamma and learning_rate","n_estimators and max_depth","kernel and degree"],
    wrong:{"1":"gamma is the minimum loss reduction required to make a split and learning_rate is the shrinkage per boosting round. both regularize in a loose sense, which makes this tempting, but neither is the L1 or L2 term on weights.", "2":"those are capacity controls, the number of trees and how deep each grows.", "3":"those are SVM hyperparameters and do not exist in XGBoost at all."}, answer:[0],
    why:"They list gamma as the minimum loss reduction for a split, alpha and lambda as the L1 and L2 regularization terms on weights, and learning_rate separately. Knowing which knob does what is the difference between tuning and guessing.",
    src:"Yang and Shami &sect;3.1, p. 7" }

{
  name: "Module 2 · Easy",
  blurb: "Definitions and recall from the feature slides.",
  questions: [
  { type:"one", q:"What is the role of a convolution layer in a CNN?",
    options:["Feature extraction","Classification","Regularization","Normalizing the input"], wrong:{1:"classification happens in the dense layers at the end. The convolution layers build the representation those layers classify.", 2:"pooling and dropout regularize; convolution extracts.", 3:"normalization is a separate layer type, such as batch norm."}, answer:[0],
    why:"A filter slides across the data and feature maps are extracted through element-wise multiplication and summation. One filter creates one feature map, and a layer generally has many.",
    src:"Slides p. 5 &middot; Raschka ch. 14, pdf pp. 482-494" },
  { type:"one", q:"What distinguishes feature <em>selection</em> from feature <em>extraction</em>?",
    options:["Selection keeps a subset of the original features; extraction builds new ones","Selection is supervised; extraction is unsupervised","Selection works on images; extraction on text","There is no difference"], wrong:{1:"both come in supervised and unsupervised forms. LDA is supervised extraction; PCA is unsupervised extraction; random-forest importance is supervised selection.", 2:"neither is tied to a modality. Both apply to images, text and tabular data alike.", 3:"the distinction is a stated module learning objective. Selection preserves interpretability because the surviving columns are still the original measurements; extraction sacrifices that for compactness."}, answer:[0],
    why:"Selection discards columns and keeps the survivors interpretable. Extraction transforms the data into a new space, as PCA and autoencoders do, so the new axes are combinations rather than originals.",
    src:"Slides p. 3 &middot; Raschka ch. 4 (selection) vs ch. 5 (extraction)" },
  { type:"one", q:"What is a latent space?",
    options:["A low-dimensional, abstract, compressed representation of the data","The output layer of a classifier","The space of all possible hyperparameters","The set of training labels"], wrong:{"1":"the output layer holds class scores. a latent space is an intermediate compressed representation with no label semantics attached to its dimensions.", "2":"that is the configuration space from Module 1, which is searched rather than learned.", "3":"labels are supervision. latent codes are learned without them, which is what makes autoencoders unsupervised."}, answer:[0],
    why:"It captures the underlying structure while discarding irrelevant detail. An encoder f maps x in &#8477;<sup>D</sup> to z in &#8477;<sup>d</sup> with D much greater than d; a decoder g maps back.",
    src:"Slides p. 7" },
  { type:"one", q:"In an autoencoder, what does the decoder do?",
    options:["Reconstructs the data from the latent representation","Maps input into the latent space","Computes the classification loss","Selects which features to keep"], wrong:{"1":"that is the encoder f. the decoder g runs the other direction, from z back to a reconstruction of x.", "2":"an autoencoder's loss is reconstruction error; there is no classification loss because there are no labels.", "3":"that is feature selection, which keeps a subset of existing features. an autoencoder extracts new ones instead."}, answer:[0],
    why:"Encoder maps in, decoder maps back out, and training minimizes the reconstruction error so that x &asymp; g(f(x)).",
    src:"Slides pp. 9 and 18 &middot; Raschka ch. 17, pdf p. 621" },
  { type:"many", q:"Which are listed as manifold learning algorithms?",
    options:["PCA","t-SNE","Isomap","Locally Linear Embedding"], answer:[0,1,2,3],
    why:"All four appear on the slides. Note Raschka covers only PCA and t-SNE; Isomap and LLE have no textbook counterpart.",
    src:"Slides pp. 11 and 14 &middot; Raschka ch. 5, pdf pp. 170-200" },
  { type:"one", q:"What does PCA project the data onto?",
    options:["Orthogonal axes capturing the most variance","Axes that maximize class separation","A random low-dimensional subspace","The axes of the original features"], wrong:{"1":"that is LDA, which is supervised. PCA never looks at labels, and the direction of greatest variance need not be the direction that separates classes.", "2":"that is random projection, a different and much cheaper method that makes no attempt to capture variance.", "3":"each principal component is a linear mixture of <em>all</em> original features, which is exactly why PCA costs you interpretability."}, answer:[0],
    why:"The principal components are the eigenvectors of the covariance matrix with the largest eigenvalues. It preserves global structure but is lossy and can cost interpretability.",
    src:"Slides p. 12 &middot; Raschka ch. 5, pdf pp. 170-177" },
  { type:"one", q:"What is the first step of the PCA algorithm?",
    options:["Mean centering the data","Computing eigenvalues","Projecting onto the top k eigenvectors","Normalizing to unit variance"], wrong:{"1":"eigenvalues come from the covariance matrix, which itself is defined in terms of centred data, so this step cannot come first.", "2":"that is the last step, after the eigenvectors are in hand.", "3":"standardizing to unit variance is a common preprocessing choice, but the algorithm as given starts with mean centring. skipping the centring is the classic implementation bug, since the covariance formula assumes it has already happened."}, answer:[0],
    why:"Subtract each feature's mean, then form the covariance matrix &Sigma; = X<sub>c</sub><sup>T</sup>X<sub>c</sub>/(n&minus;1), then do the eigendecomposition, then project.",
    src:"Slides p. 13 &middot; Raschka ch. 5, pdf pp. 173-175" },
  { type:"tf", q:"An autoencoder requires labelled training data.",
    wrong:{0:"choosing True misses what makes autoencoders useful. The target <em>is</em> the input, so the label comes free. That is why they can be trained on unlimited unlabelled data and why they underpin self-supervised pretraining."}, answer:[1],
    why:"False. It is explicitly a way to represent input data <em>without</em> labels, trained to reconstruct its own input. The slides call it a regression task that models an identity function.",
    src:"Slides p. 17" },
  { type:"one", q:"In Tf-Idf, what does the idf term correct for?",
    options:["Common words that appear in many documents","Documents of different lengths","Misspelled tokens","Words that appear only once"], wrong:{"1":"document length is handled by normalizing the term frequencies. idf is about how many documents a term appears in, not how long any one of them is.", "2":"misspellings are a tokenization concern, and idf will happily give a misspelled token a high weight precisely because it is rare.", "3":"idf boosts rare terms rather than correcting for them, so this inverts what the term does."}, answer:[0],
    why:"Raw term frequency over-weights words like 'the', or 'news' in a news corpus. Inverse document frequency down-weights terms that appear across many documents, letting rarer, more meaningful terms carry weight.",
    src:"Slides p. 16 &middot; Raschka ch. 8, pdf pp. 283-285" },
  { type:"one", q:"Sparse coding represents input data as what?",

  { type:"one", q:"What does a variational autoencoder generate that a plain autoencoder does not?",

  { type:"tf", q:"t-SNE minimizes the Kullback-Leibler divergence between a high-dimensional distribution P and a low-dimensional distribution Q.",

  { type:"one", q:"Isomap builds its low-dimensional embedding using what?",

  { type:"one", q:"What does the encoder in a latent-space model do?",

    why:"The Gaussian assumption on the error is what produces the squared reconstruction term. The Laplacian-shaped <em>prior</em> on the coefficients, P(s<sub>j</sub>) &prop; exp(&minus;&beta;&phi;(s<sub>j</sub>)), is what produces the L1 penalty.",

    why:"log p(x) &ge; E<sub>q</sub>[log p<sub>&theta;</sub>(x|z)] &minus; KL(q<sub>&phi;</sub>(z|x) || p(z)). You maximize the bound because the true log-evidence is intractable, and the two terms pull against each other: reconstruct well, but stay close to the prior.",

function A(url, text, page) {
  return `<a href="${url}${page?("#page="+page):""}" target="_blank" rel="noopener">${text}</a>`;
}
function linkify(src, bank) {
  const m2 = /Module 2/.test(bank || "");
  let s = " " + src + " ";

  // AML transcripts (longest names first)
  Object.keys(AML_TR).sort((a,b)=>b.length-a.length).forEach(name => {
    if (s.includes(name)) {
      const [mod, file] = AML_TR[name];
      s = s.split(name).join(A((mod===1?F.tr1:F.tr2)+file, name));
    }
  });
  // AML slides
  s = s.replace(/Slides pp?\. ([\d\-, and]+)/g, (full, pgs) => {
    const first = (pgs.match(/\d+/) || [1])[0];
    return A(m2 ? F.amlSlides2 : F.amlSlides1, full, first);
  });
  // Raschka: pdf page given directly
  s = s.replace(/Raschka(?:(?!<\/?a)[\s\S]){0,90}?pdf pp?\. (\d+)(?:-\d+)?/g,
    (full, p) => A(F.raschka, full, p));
  s = s.replace(/(Raschka ch\. \d+)(?![^<]*<\/a>)/g, (full) => A(F.raschka, full));
  // Yang and Shami, Lee et al.
  s = s.replace(/Yang and Shami/g,
    A(F.yang, "Yang and Shami") + ' <span class="doi">' + A("https://doi.org/10.1016/j.neucom.2020.07.061","doi") + '</span>');
  s = s.replace(/Lee et al\./g, A(F.lee, "Lee et al."));

  // RUU lecture notes: page label like (1-5) or (2-7)
  s = s.replace(/\(([12])-(\d+)\)/g, (full, mod, pg) =>
    "(" + A(mod === "1" ? F.ruuNotes1 : F.ruuNotes2, mod + "-" + pg, pg) + ")");
  s = s.replace(/Notes (Def\.|Cor\.|Prop\.|Example|&sect;|§)/g, (full, kw) =>
    A(m2 ? F.ruuNotes2 : F.ruuNotes1, "Notes") + " " + kw);
  // RUU lecture decks
  s = s.replace(/Lecture ([12][A-D])(,? slides? ([\d]+))?/g, (full, id, _x, slide) => {
    const base = id[0] === "1" ? F.ruuLec1 : F.ruuLec2;
    return A(base + RUU_LEC[id], full, slide);
  });
  // Koller: book page -> pdf page + 37
  s = s.replace(/Koller(?:(?!<\/?a)[\s\S]){0,70}?book pp?\. (\d+)(?:-\d+)?/g,
    (full, p) => A(F.koller, full, parseInt(p,10) + 37));
  s = s.replace(/(Koller (?:&sect;|§|Def\.|Prop\.|Thm\.|Example|ch\.)[^&<,]*)(?![^<]*<\/a>)/g,
    (full) => A(F.koller, full));
  s = s.replace(/Cox 1946/g, A(F.coxPdf, "Cox 1946") +
    ' <span class="doi">' + A("https://doi.org/10.1119/1.1990764","doi") + '</span>');
  s = s.replace(/Cheeseman(?![^<]*<\/a>)/g, A(F.cheeseman, "Cheeseman"));
  return s.trim();
}


let sel = [], mode = "sample", POOL = [], order = [], done = {};

function readURL() {
  const q = new URLSearchParams(location.search);
  const raw = (q.get("m") || q.get("module") || "").trim();
  if (raw) sel = raw.split(/[,+ ]+/).map(v => parseInt(v,10)-1)
                    .filter(i => Number.isInteger(i) && i>=0 && i<BANKS.length);
  if (!sel.length) sel = [0];
  mode = q.get("mode") === "all" ? "all" : "sample";
}
function syncURL() {
  const q = new URLSearchParams();
  q.set("m", sel.map(i=>i+1).join(",")); q.set("mode", mode);
  const url = location.pathname + "?" + q.toString();
  history.replaceState(null, "", url);
  document.getElementById("permalink").innerHTML =
    `Link to this set: <a href="${url}">${location.origin + url}</a>`;
}
function chipRow(el, items, cur, cb) {
  const lbl = el.querySelector(".lbl"); el.innerHTML = ""; if (lbl) el.appendChild(lbl);
  items.forEach(([v,label]) => {
    const b = document.createElement("button");
    b.className="chip"; b.dataset.v=v;
    b.setAttribute("aria-pressed", String(Array.isArray(cur) ? cur.includes(v) : cur===v));
    b.textContent=label; b.onclick=()=>cb(v); el.appendChild(b);
  });
}
function paintChips() {
  chipRow(document.getElementById("bankPick"),
    BANKS.map((b,i)=>[i, b.name.replace(/ - .*/,"")]), sel,
    i => { if (sel.includes(i)) { if (sel.length>1) sel=sel.filter(v=>v!==i); }
           else sel=[...sel,i].sort((a,b)=>a-b); paintChips(); build(); });
  document.querySelectorAll("#modeSeg button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === mode));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function build() {
  POOL = [];
  sel.forEach(i => BANKS[i].questions.forEach(q => POOL.push({...q, bank: BANKS[i].name})));
  order = POOL.map((_,i)=>i);
  if (mode === "sample") order = shuffle(order).slice(0, Math.min(10, order.length));
  syncURL();
  document.getElementById("poolInfo").textContent = mode === "sample"
    ? `${order.length} drawn at random from a bank of ${POOL.length}`
    : `all ${POOL.length} questions`;
  render();
}

function render() {
  done = {};
  scoreBox.hidden = true;
  document.getElementById("retry").hidden = true;
  document.getElementById("submit").disabled = false;
  document.getElementById("submit2").disabled = false;
  form.innerHTML = "";
  const multi = sel.length > 1;
  order.forEach((qi, n) => {
    const q = POOL[qi];
    const card = document.createElement("div");
    card.className="q"; card.dataset.qi=qi;
    const head = document.createElement("div");
    head.className="qhead";
    head.innerHTML = `<span class="qnum">Question ${n+1}</span>` +
      (multi ? `<span class="bankTag">${q.bank.replace(/ - .*/,"")}</span>` : "") +
      `<span class="tag">${TAG[q.type]}</span>`;
    card.appendChild(head);
    const text = document.createElement("p");
    text.className="qtext"; text.innerHTML=q.q; card.appendChild(text);
    if (q.type === "fill") {
      const inp=document.createElement("input");
      inp.type="text"; inp.placeholder="your answer"; inp.name="q"+qi; card.appendChild(inp);
    } else {
      const opts = q.type==="tf" ? ["True","False"] : q.options;
      const kind = q.type==="many" ? "checkbox" : "radio";
      opts.forEach((opt,oi)=>{
        const lab=document.createElement("label");
        lab.className="opt"; lab.dataset.oi=oi;
        lab.innerHTML=`<input type="${kind}" name="q${qi}" value="${oi}"><span>${opt}</span>`;
        card.appendChild(lab);
      });
    }
    const btn = document.createElement("button");
    btn.className="checkbtn"; btn.type="button"; btn.textContent="Check this answer";
    btn.onclick = () => checkOne(qi);
    card.appendChild(btn);
    form.appendChild(card);
  });
  KX(form);
}

function normalize(s){ return s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.?!]$/,""); }
const optText = (q,i) => q.type==="tf" ? ["True","False"][i] : q.options[i];

function checkOne(qi) {
  if (done[qi] !== undefined) return done[qi];
  const q = POOL[qi];
  const card = form.querySelector(`[data-qi="${qi}"]`);
  let ok=false, picked=[];

  if (q.type === "fill") {
    const inp = card.querySelector("input[type=text]");
    const given = normalize(inp.value);
    ok = q.answer.some(a=>{const n=normalize(a);
      return given===n || given===n+" theory" || given===n+" space" || given===n+" parameter";});
    inp.disabled = true;
    inp.style.borderColor = ok ? "var(--good)" : "var(--bad)";
  } else {
    picked = [...card.querySelectorAll("input:checked")].map(i=>+i.value);
    ok = picked.length===q.answer.length && picked.every(p=>q.answer.includes(p));
    card.querySelectorAll("label.opt").forEach(lab=>{
      const oi=+lab.dataset.oi;
      lab.querySelector("input").disabled=true;
      const isAns=q.answer.includes(oi), chosen=picked.includes(oi);
      if (isAns) { lab.classList.add("correct");
        const m=document.createElement("span"); m.className="mark g";
        m.textContent = chosen ? "correct" : "correct answer"; lab.appendChild(m); }
      else if (chosen) { lab.classList.add("wrong");
        const m=document.createElement("span"); m.className="mark b";
        m.textContent="your answer"; lab.appendChild(m); }
    });
  }

  card.querySelector(".checkbtn")?.remove();

  const why=document.createElement("div");
  why.className="why";
  why.innerHTML = `<b>${ok ? "Correct" : "Not quite"}</b>${q.why}`;
  card.appendChild(why);

  if (!ok) {
    const chosen = q.type==="fill"
      ? [] : picked.filter(i => !q.answer.includes(i));
    const missed = q.type==="fill"
      ? [] : q.answer.filter(i => !picked.includes(i));
    let html = "";
    chosen.forEach(i => {
      const custom = q.wrong && q.wrong[i];
      html += `<p><b>&ldquo;${optText(q,i)}&rdquo;</b> &mdash; ` +
        (custom || `not the answer here. The explanation above gives the one that is; the reading below settles it.`) + `</p>`;
    });
    if (q.type==="fill" && !ok) {
      html += `<p>The answer is <b>${q.answer[0]}</b>. ${(q.wrong && q.wrong.fill) || "Check the spelling and note that only the missing word goes in the box."}</p>`;
    }
    if (missed.length) {
      html += `<p><b>You missed:</b> ` + missed.map(i=>`&ldquo;${optText(q,i)}&rdquo;`).join(", ") +
        `. On a select-all, leaving a correct option out costs the same as adding a wrong one.</p>`;
    }
    if (html) {
      const wb=document.createElement("div");
      wb.className="wrongbox";
      wb.innerHTML=`<div class="l">Why your choice does not work</div>${html}`;
      card.appendChild(wb);
    }
  }

  const rn=document.createElement("div");
  rn.className="readnext";
  rn.innerHTML=`<div class="l">Read next</div>${linkify(q.src, q.bank)}` +
    `<div class="hint">Links open the file in the private repo. PDF page numbers are already converted, so <b>Koller book p. 16</b> opens at pdf page 53.</div>`;
  card.appendChild(rn);

  KX(card);
  done[qi]=ok;
  if (Object.keys(done).length === order.length) showScore();
  return ok;
}

function showScore() {
  const total=order.length;
  const correct=order.filter(qi=>done[qi]).length;
  const pct=Math.round(correct/total*100);
  scoreBox.hidden=false;
  scoreBox.innerHTML=`
    <h2>${sel.map(i=>BANKS[i].name.replace(/ - .*/,"")).join(" + ")}</h2>
    <div class="pct">${correct} / ${total} &middot; ${pct}%</div>
    <div class="bar"><div></div></div>
    <div class="breakdown">${
      pct===100 ? "Every one. Draw another set to be sure it wasn't the shuffle."
      : pct>=80 ? "Solid. Read the Read next line on anything you missed."
      : pct>=50 ? "Worth another pass through the sources before the next draw."
      : "Start with the source material, then come back."}</div>`;
  requestAnimationFrame(()=>{scoreBox.querySelector(".bar > div").style.width=pct+"%";});
  document.getElementById("retry").hidden=false;
  document.getElementById("submit").disabled=true;
  document.getElementById("submit2").disabled=true;
}

function gradeAll(){ order.forEach(qi=>checkOne(qi));
  scoreBox.scrollIntoView({behavior:"smooth",block:"start"}); }

document.getElementById("submit").onclick=gradeAll;
document.getElementById("submit2").onclick=gradeAll;
document.getElementById("retry").onclick=()=>{render();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("newSet").onclick=()=>{build();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("modeSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  mode=b.dataset.mode;paintChips();build();};

readURL(); paintChips(); build();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
window.KX = function (root) {
  if (!window.renderMathInElement) return;
  try {
    renderMathInElement(root || document.body, {
      delimiters: [{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],
      throwOnError: false,
      ignoredTags: ["script","noscript","style","textarea","pre","option"]
    });
  } catch (e) {}
};
window.addEventListener("load", function(){ KX(); });
</script>
